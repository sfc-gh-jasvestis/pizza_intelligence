# ============================================================================
# PIZZA INTELLIGENCE - QSR Master Semantic Model
# Cortex Analyst Semantic Model for Pizza Time Machine Kitchen
# ============================================================================
# This semantic model is the partner's reusable IP - build once for pizza,
# reuse for burgers, tacos, coffee, and other QSR brands.
# ============================================================================

name: pizza_intelligence
description: |
  QSR Master Schema for Pizza Intelligence - enabling natural language queries 
  over pizza operations data including orders, deliveries, inventory, staffing, 
  and campaign performance. This semantic model powers the Pizza Time Machine 
  Kitchen, turning scattered data into actionable intelligence about past 
  performance, current operations, and future predictions.

# ============================================================================
# TABLES
# ============================================================================
tables:

  # --------------------------------------------------------------------------
  # ORDERS - Core transaction data (pre-joined with store and calendar)
  # --------------------------------------------------------------------------
  - name: orders
    description: |
      All pizza orders across all channels (app, web, phone, in-store, third-party).
      Each record represents a complete order with totals, discounts, and metadata.
      Includes store details (name, city, region) and calendar info (game days, weather).
      Use this table to analyze sales performance, order patterns, and revenue.
    base_table:
      database: PIZZA_INTELLIGENCE
      schema: ANALYTICS
      table: V_ORDERS
    
    dimensions:
      - name: order_id
        description: Unique identifier for each order
        expr: order_id
        data_type: VARCHAR
        unique: true
        
      - name: order_date
        description: Date when the order was placed
        expr: order_date
        data_type: DATE
        
      - name: store_id
        description: Store identifier
        expr: store_id
        data_type: VARCHAR
        
      - name: store_name
        description: Name of the store location
        expr: store_name
        data_type: VARCHAR
        
      - name: city
        description: City where the store is located
        expr: city
        data_type: VARCHAR
        sample_values: ['Phoenix', 'Chicago', 'New York', 'Los Angeles', 'Miami']
        
      - name: state
        description: State where the store is located
        expr: state
        data_type: VARCHAR
        
      - name: region
        description: Geographic region
        expr: region
        data_type: VARCHAR
        sample_values: ['Southwest', 'Midwest', 'Northeast', 'West', 'Southeast']
        
      - name: district
        description: District/metro area
        expr: district
        data_type: VARCHAR
        
      - name: order_channel
        description: How the order was placed - app, web, phone, in_store, or third_party
        expr: order_channel
        data_type: VARCHAR
        sample_values: ['app', 'web', 'phone', 'in_store', 'third_party']
        
      - name: order_type
        description: Fulfillment type - delivery, pickup, or dine_in
        expr: order_type
        data_type: VARCHAR
        sample_values: ['delivery', 'pickup', 'dine_in']
        
      - name: payment_method
        description: How the customer paid
        expr: payment_method
        data_type: VARCHAR
        sample_values: ['credit_card', 'debit_card', 'apple_pay', 'cash']
        
      - name: is_first_order
        description: Whether this was the customer's first order (true/false)
        expr: is_first_order
        data_type: BOOLEAN
        
      - name: customer_id
        description: Customer who placed the order
        expr: customer_id
        data_type: VARCHAR
        
      - name: campaign_id
        description: Campaign associated with the order if any
        expr: campaign_id
        data_type: VARCHAR
        
      - name: day_of_week
        description: Day of the week (Monday, Tuesday, etc.)
        expr: day_of_week
        data_type: VARCHAR
        
      - name: is_weekend
        description: Whether the order was placed on a weekend
        expr: is_weekend
        data_type: BOOLEAN
        
      - name: is_game_day
        description: Whether there was a sports event that day
        expr: is_game_day
        data_type: BOOLEAN
        synonyms: ['game night', 'sports event']
        
      - name: game_event
        description: Name of the game/event if any
        expr: game_event
        data_type: VARCHAR
        
      - name: weather_condition
        description: Weather on order date
        expr: weather_condition
        data_type: VARCHAR
        sample_values: ['sunny', 'rainy', 'hot', 'cold']

    time_dimensions:
      - name: order_timestamp
        description: Exact date and time when the order was placed
        expr: order_timestamp
        data_type: TIMESTAMP_NTZ

    measures:
      - name: total_amount
        description: Order total amount including tax, delivery fees, and tips
        expr: total_amount
        data_type: NUMBER
        default_aggregation: sum
        
      - name: subtotal
        description: Subtotal before tax, fees, and tips
        expr: subtotal
        data_type: NUMBER
        default_aggregation: sum
        
      - name: discount_amount
        description: Discount amount applied to order
        expr: discount_amount
        data_type: NUMBER
        default_aggregation: sum
        
      - name: item_count
        description: Number of items in the order
        expr: item_count
        data_type: NUMBER
        default_aggregation: sum
        
      - name: delivery_fee
        description: Delivery fee charged
        expr: delivery_fee
        data_type: NUMBER
        default_aggregation: sum
        
      - name: tip_amount
        description: Tip amount
        expr: tip_amount
        data_type: NUMBER
        default_aggregation: sum

  # --------------------------------------------------------------------------
  # STORES - Location dimension
  # --------------------------------------------------------------------------
  - name: stores
    description: |
      Pizza store locations with geographic, operational, and proximity data.
      Includes stadium proximity for game-day forecasting.
    base_table:
      database: PIZZA_INTELLIGENCE
      schema: ANALYTICS
      table: DIM_STORES
    
    dimensions:
      - name: store_id
        description: Unique store identifier
        expr: store_id
        data_type: VARCHAR
        unique: true
        
      - name: store_name
        description: Store name/location description
        expr: store_name
        data_type: VARCHAR
        
      - name: city
        description: City where the store is located
        expr: city
        data_type: VARCHAR
        sample_values: ['Phoenix', 'Chicago', 'New York', 'Los Angeles', 'Miami']
        
      - name: state
        description: State code
        expr: state
        data_type: VARCHAR
        sample_values: ['AZ', 'IL', 'NY', 'CA', 'FL']
        
      - name: region
        description: Geographic region
        expr: region
        data_type: VARCHAR
        sample_values: ['Southwest', 'Midwest', 'Northeast', 'West', 'Southeast']
        
      - name: district
        description: District/metro area
        expr: district
        data_type: VARCHAR
        
      - name: store_type
        description: Store format - dine_in, delivery_only, or hybrid
        expr: store_type
        data_type: VARCHAR
        sample_values: ['dine_in', 'delivery_only', 'hybrid']
        
      - name: manager_name
        description: Store manager name
        expr: manager_name
        data_type: VARCHAR
        
      - name: nearby_stadium
        description: Name of nearby stadium for event-based forecasting
        expr: nearby_stadium
        data_type: VARCHAR
        
      - name: has_drive_thru
        description: Whether the store has a drive-through
        expr: has_drive_thru
        data_type: BOOLEAN

    measures:
      - name: stadium_distance_km
        description: Distance to nearby stadium in km
        expr: stadium_distance_km
        data_type: NUMBER
        default_aggregation: sum

  # --------------------------------------------------------------------------
  # PRODUCTS - Menu items
  # --------------------------------------------------------------------------
  - name: products
    description: |
      Menu items including pizzas, sides, drinks, and desserts.
      Contains pricing, cost, and nutritional information.
    base_table:
      database: PIZZA_INTELLIGENCE
      schema: ANALYTICS
      table: DIM_PRODUCTS
    
    dimensions:
      - name: product_id
        description: Unique product identifier
        expr: product_id
        data_type: VARCHAR
        unique: true
        
      - name: product_name
        description: Name of the menu item
        expr: product_name
        data_type: VARCHAR
        
      - name: category
        description: Product category
        expr: category
        data_type: VARCHAR
        sample_values: ['pizza', 'sides', 'drinks', 'desserts']
        
      - name: subcategory
        description: Product subcategory (crust type for pizzas, etc.)
        expr: subcategory
        data_type: VARCHAR
        sample_values: ['thin_crust', 'pan', 'stuffed', 'wings', 'salad', 'soda']
        synonyms: ['crust type', 'crust']
        
      - name: size
        description: Product size
        expr: size
        data_type: VARCHAR
        sample_values: ['small', 'medium', 'large', 'family']
        
      - name: is_signature
        description: Whether this is a signature/featured item
        expr: is_signature
        data_type: BOOLEAN
        
      - name: is_seasonal
        description: Whether this is a seasonal/limited-time item
        expr: is_seasonal
        data_type: BOOLEAN

    measures:
      - name: base_price
        description: Product base price
        expr: base_price
        data_type: NUMBER
        default_aggregation: sum
        
      - name: cost
        description: Product cost
        expr: cost
        data_type: NUMBER
        default_aggregation: sum

  # --------------------------------------------------------------------------
  # DELIVERIES - Delivery performance (pre-joined with store and calendar)
  # --------------------------------------------------------------------------
  - name: deliveries
    description: |
      Delivery fulfillment data including timing, ratings, and late delivery analysis.
      Includes store details and calendar info. Use this to understand delivery 
      performance and identify issues.
    base_table:
      database: PIZZA_INTELLIGENCE
      schema: ANALYTICS
      table: V_DELIVERIES
    
    dimensions:
      - name: delivery_id
        description: Unique delivery identifier
        expr: delivery_id
        data_type: VARCHAR
        unique: true
        
      - name: delivery_date
        description: Date of delivery
        expr: delivery_date
        data_type: DATE
        
      - name: store_id
        description: Store identifier
        expr: store_id
        data_type: VARCHAR
        
      - name: store_name
        description: Name of the store location
        expr: store_name
        data_type: VARCHAR
        
      - name: city
        description: City where the store is located
        expr: city
        data_type: VARCHAR
        sample_values: ['Phoenix', 'Chicago', 'New York', 'Los Angeles', 'Miami']
        
      - name: region
        description: Geographic region
        expr: region
        data_type: VARCHAR
        
      - name: is_late
        description: Whether the delivery was late (true/false)
        expr: is_late
        data_type: BOOLEAN
        
      - name: late_reason
        description: Reason for late delivery if applicable
        expr: late_reason
        data_type: VARCHAR
        sample_values: ['traffic', 'kitchen_delay', 'rider_shortage', 'weather']
        synonyms: ['delay reason', 'why late']
        
      - name: rider_id
        description: Delivery rider identifier
        expr: rider_id
        data_type: VARCHAR
        
      - name: is_game_day
        description: Whether delivery was on a game day
        expr: is_game_day
        data_type: BOOLEAN
        
      - name: weather_condition
        description: Weather on delivery date
        expr: weather_condition
        data_type: VARCHAR

    measures:
      - name: delivery_duration_min
        description: Delivery duration in minutes
        expr: delivery_duration_min
        data_type: NUMBER
        default_aggregation: sum
        
      - name: late_minutes
        description: Minutes late for late deliveries
        expr: late_minutes
        data_type: NUMBER
        default_aggregation: sum
        
      - name: customer_rating
        description: Customer rating (1-5 scale)
        expr: customer_rating
        data_type: NUMBER
        default_aggregation: sum
        synonyms: ['delivery rating', 'rating']

  # --------------------------------------------------------------------------
  # CAMPAIGNS - Marketing campaigns
  # --------------------------------------------------------------------------
  - name: campaigns
    description: |
      Marketing campaigns and promotions including discounts, bundles, and loyalty programs.
    base_table:
      database: PIZZA_INTELLIGENCE
      schema: ANALYTICS
      table: DIM_CAMPAIGNS
    
    dimensions:
      - name: campaign_id
        description: Unique campaign identifier
        expr: campaign_id
        data_type: VARCHAR
        unique: true
        
      - name: campaign_name
        description: Name of the campaign
        expr: campaign_name
        data_type: VARCHAR
        
      - name: campaign_type
        description: Type of promotion
        expr: campaign_type
        data_type: VARCHAR
        sample_values: ['discount', 'bogo', 'bundle', 'loyalty']
        synonyms: ['promo type', 'promotion type']
        
      - name: channel
        description: Marketing channel
        expr: channel
        data_type: VARCHAR
        sample_values: ['app', 'email', 'sms', 'in_store', 'social', 'all']
        
      - name: target_segment
        description: Customer segment targeted
        expr: target_segment
        data_type: VARCHAR
        sample_values: ['new_customers', 'lapsed', 'vip', 'regular', 'all']
        
      - name: status
        description: Campaign status
        expr: status
        data_type: VARCHAR
        sample_values: ['active', 'completed', 'planned', 'paused']

    time_dimensions:
      - name: start_date
        description: Campaign start date
        expr: start_date
        data_type: DATE
        
      - name: end_date
        description: Campaign end date
        expr: end_date
        data_type: DATE

    measures:
      - name: budget
        description: Campaign budget
        expr: budget
        data_type: NUMBER
        default_aggregation: sum
        
      - name: discount_percent
        description: Discount percentage
        expr: discount_percent
        data_type: NUMBER
        default_aggregation: sum

  # --------------------------------------------------------------------------
  # CAMPAIGN PERFORMANCE - Marketing ROI (pre-joined with campaign and store)
  # --------------------------------------------------------------------------
  - name: campaign_performance
    description: |
      Daily campaign performance metrics including impressions, clicks, redemptions, and ROI.
      Includes campaign and store details. Use this to evaluate marketing effectiveness.
    base_table:
      database: PIZZA_INTELLIGENCE
      schema: ANALYTICS
      table: V_CAMPAIGN_PERFORMANCE
    
    dimensions:
      - name: performance_date
        description: Date of performance metrics
        expr: performance_date
        data_type: DATE
        
      - name: campaign_id
        description: Campaign identifier
        expr: campaign_id
        data_type: VARCHAR
        
      - name: campaign_name
        description: Name of the campaign
        expr: campaign_name
        data_type: VARCHAR
        
      - name: campaign_type
        description: Type of promotion
        expr: campaign_type
        data_type: VARCHAR
        sample_values: ['discount', 'bogo', 'bundle', 'loyalty']
        
      - name: channel
        description: Marketing channel
        expr: channel
        data_type: VARCHAR
        
      - name: store_id
        description: Store identifier
        expr: store_id
        data_type: VARCHAR
        
      - name: store_name
        description: Name of the store location
        expr: store_name
        data_type: VARCHAR
        
      - name: city
        description: City where the store is located
        expr: city
        data_type: VARCHAR
        
      - name: region
        description: Geographic region
        expr: region
        data_type: VARCHAR

    measures:
      - name: impressions
        description: Ad impressions
        expr: impressions
        data_type: NUMBER
        default_aggregation: sum
        
      - name: clicks
        description: Clicks on ads/promotions
        expr: clicks
        data_type: NUMBER
        default_aggregation: sum
        
      - name: redemptions
        description: Coupon/promo redemptions
        expr: redemptions
        data_type: NUMBER
        default_aggregation: sum
        
      - name: orders_attributed
        description: Orders attributed to campaigns
        expr: orders_attributed
        data_type: NUMBER
        default_aggregation: sum
        
      - name: revenue_attributed
        description: Revenue attributed to campaigns
        expr: revenue_attributed
        data_type: NUMBER
        default_aggregation: sum
        
      - name: discount_cost
        description: Cost of discounts given
        expr: discount_cost
        data_type: NUMBER
        default_aggregation: sum
        
      - name: incremental_revenue
        description: Incremental revenue generated above baseline
        expr: incremental_revenue
        data_type: NUMBER
        default_aggregation: sum
        
      - name: roi_percent
        description: ROI percentage
        expr: roi_percent
        data_type: NUMBER
        default_aggregation: sum
        synonyms: ['ROI', 'return on investment']

  # --------------------------------------------------------------------------
  # INVENTORY - Stock levels and wastage (pre-joined with store)
  # --------------------------------------------------------------------------
  - name: inventory
    description: |
      Daily inventory snapshots including stock levels, reorder points, and wastage.
      Includes store details. Use this to optimize inventory and reduce waste.
    base_table:
      database: PIZZA_INTELLIGENCE
      schema: ANALYTICS
      table: V_INVENTORY
    
    dimensions:
      - name: snapshot_date
        description: Date of inventory snapshot
        expr: snapshot_date
        data_type: DATE
        
      - name: store_id
        description: Store identifier
        expr: store_id
        data_type: VARCHAR
        
      - name: store_name
        description: Name of the store location
        expr: store_name
        data_type: VARCHAR
        
      - name: city
        description: City where the store is located
        expr: city
        data_type: VARCHAR
        
      - name: region
        description: Geographic region
        expr: region
        data_type: VARCHAR
        
      - name: ingredient_name
        description: Name of ingredient/supply item
        expr: ingredient_name
        data_type: VARCHAR
        synonyms: ['ingredient', 'item']
        
      - name: ingredient_category
        description: Category of ingredient
        expr: ingredient_category
        data_type: VARCHAR
        sample_values: ['dough', 'cheese', 'toppings', 'sauces', 'packaging']
        
      - name: wastage_reason
        description: Reason for wastage if any
        expr: wastage_reason
        data_type: VARCHAR
        sample_values: ['expired', 'damaged', 'quality', 'overproduction']

    measures:
      - name: quantity_on_hand
        description: Quantity of items in stock
        expr: quantity_on_hand
        data_type: NUMBER
        default_aggregation: sum
        
      - name: wastage_units
        description: Units wasted
        expr: wastage_units
        data_type: NUMBER
        default_aggregation: sum
        synonyms: ['waste', 'wasted']
        
      - name: unit_cost
        description: Unit cost
        expr: unit_cost
        data_type: NUMBER
        default_aggregation: sum

  # --------------------------------------------------------------------------
  # STAFFING - Labor and scheduling (pre-joined with store)
  # --------------------------------------------------------------------------
  - name: staffing
    description: |
      Daily staffing data including scheduled vs actual staff, overtime, and labor costs.
      Includes store details. Use this for labor planning and cost optimization.
    base_table:
      database: PIZZA_INTELLIGENCE
      schema: ANALYTICS
      table: V_STAFFING
    
    dimensions:
      - name: shift_date
        description: Date of the shift
        expr: shift_date
        data_type: DATE
        
      - name: store_id
        description: Store identifier
        expr: store_id
        data_type: VARCHAR
        
      - name: store_name
        description: Name of the store location
        expr: store_name
        data_type: VARCHAR
        
      - name: city
        description: City where the store is located
        expr: city
        data_type: VARCHAR
        
      - name: region
        description: Geographic region
        expr: region
        data_type: VARCHAR
        
      - name: shift_type
        description: Type of shift
        expr: shift_type
        data_type: VARCHAR
        sample_values: ['morning', 'afternoon', 'evening', 'night']
        
      - name: is_game_day
        description: Whether shift was on a game day
        expr: is_game_day
        data_type: BOOLEAN

    measures:
      - name: scheduled_staff
        description: Staff scheduled
        expr: scheduled_staff
        data_type: NUMBER
        default_aggregation: sum
        
      - name: actual_staff
        description: Staff who actually worked
        expr: actual_staff
        data_type: NUMBER
        default_aggregation: sum
        
      - name: overtime_hours
        description: Overtime hours worked
        expr: overtime_hours
        data_type: NUMBER
        default_aggregation: sum
        
      - name: labor_cost
        description: Labor cost
        expr: labor_cost
        data_type: NUMBER
        default_aggregation: sum
        
      - name: riders_available
        description: Delivery riders available
        expr: riders_available
        data_type: NUMBER
        default_aggregation: sum

  # --------------------------------------------------------------------------
  # CALENDAR - Time dimension with events
  # --------------------------------------------------------------------------
  - name: calendar
    description: |
      Calendar dimension with holidays, game days, and weather for forecasting.
      Use this to understand seasonal patterns and event impacts.
    base_table:
      database: PIZZA_INTELLIGENCE
      schema: ANALYTICS
      table: DIM_CALENDAR
    
    dimensions:
      - name: date_key
        description: Calendar date
        expr: date_key
        data_type: DATE
        unique: true
        
      - name: day_of_week
        description: Day name (Monday, Tuesday, etc.)
        expr: day_of_week
        data_type: VARCHAR
        
      - name: is_weekend
        description: Whether the date is a weekend
        expr: is_weekend
        data_type: BOOLEAN
        
      - name: month_name
        description: Month name
        expr: month_name
        data_type: VARCHAR
        
      - name: quarter
        description: Quarter (1-4)
        expr: quarter
        data_type: NUMBER
        
      - name: year
        description: Year
        expr: year
        data_type: NUMBER
        
      - name: is_holiday
        description: Whether the date is a holiday
        expr: is_holiday
        data_type: BOOLEAN
        
      - name: holiday_name
        description: Name of the holiday if applicable
        expr: holiday_name
        data_type: VARCHAR
        
      - name: is_game_day
        description: Whether there's a major sports event
        expr: is_game_day
        data_type: BOOLEAN
        synonyms: ['game night', 'sports event']
        
      - name: game_event
        description: Name of the game/event if applicable
        expr: game_event
        data_type: VARCHAR
        sample_values: ['NFL Sunday', 'NFL Playoffs', 'Super Bowl']
        
      - name: weather_condition
        description: Weather condition
        expr: weather_condition
        data_type: VARCHAR
        sample_values: ['sunny', 'rainy', 'hot', 'cold']
        synonyms: ['weather']

    measures:
      - name: high_temp_f
        description: High temperature in Fahrenheit
        expr: high_temp_f
        data_type: NUMBER
        default_aggregation: sum

  # --------------------------------------------------------------------------
  # CUSTOMERS - Customer dimension
  # --------------------------------------------------------------------------
  - name: customers
    description: |
      Customer information including segments, loyalty tiers, and lifetime value.
    base_table:
      database: PIZZA_INTELLIGENCE
      schema: ANALYTICS
      table: DIM_CUSTOMERS
    
    dimensions:
      - name: customer_id
        description: Unique customer identifier
        expr: customer_id
        data_type: VARCHAR
        unique: true
        
      - name: customer_segment
        description: Customer segment
        expr: customer_segment
        data_type: VARCHAR
        sample_values: ['new', 'regular', 'vip', 'lapsed']
        
      - name: loyalty_tier
        description: Loyalty program tier
        expr: loyalty_tier
        data_type: VARCHAR
        sample_values: ['bronze', 'silver', 'gold', 'platinum']
        
      - name: preferred_channel
        description: Customer's preferred ordering channel
        expr: preferred_channel
        data_type: VARCHAR

    measures:
      - name: lifetime_value
        description: Customer lifetime value
        expr: lifetime_value
        data_type: NUMBER
        default_aggregation: sum
        synonyms: ['LTV', 'CLV']
        
      - name: loyalty_points
        description: Loyalty points
        expr: loyalty_points
        data_type: NUMBER
        default_aggregation: sum
        
      - name: lifetime_orders
        description: Lifetime orders
        expr: lifetime_orders
        data_type: NUMBER
        default_aggregation: sum

  # --------------------------------------------------------------------------
  # KITCHEN CAPACITY - Oven and production capacity tracking
  # --------------------------------------------------------------------------
  - name: kitchen_capacity
    description: |
      Kitchen capacity and oven status tracking. Use this table to understand 
      production constraints, oven downtime, and capacity issues that may affect
      product availability. CRITICAL for understanding why certain pizza types 
      (especially thin-crust) may have reduced sales.
    base_table:
      database: PIZZA_INTELLIGENCE
      schema: ANALYTICS
      table: V_KITCHEN_CAPACITY
    
    dimensions:
      - name: capacity_id
        description: Unique identifier for each capacity record
        expr: capacity_id
        data_type: VARCHAR
        unique: true
        
      - name: store_id
        description: Store identifier
        expr: store_id
        data_type: VARCHAR
        
      - name: store_name
        description: Name of the store location
        expr: store_name
        data_type: VARCHAR
        
      - name: city
        description: City where the store is located
        expr: city
        data_type: VARCHAR
        sample_values: ['Phoenix', 'Chicago', 'New York', 'Los Angeles', 'Miami']
        
      - name: region
        description: Geographic region
        expr: region
        data_type: VARCHAR
        
      - name: capacity_date
        description: Date of capacity record
        expr: capacity_date
        data_type: DATE
        
      - name: shift_type
        description: Type of shift (morning, afternoon, evening)
        expr: shift_type
        data_type: VARCHAR
        sample_values: ['morning', 'afternoon', 'evening']
        
      - name: downtime_reason
        description: Reason for oven downtime if any
        expr: downtime_reason
        data_type: VARCHAR
        synonyms: ['oven issue', 'kitchen issue', 'equipment problem']
        
      - name: notes
        description: Additional notes about kitchen capacity
        expr: notes
        data_type: VARCHAR
        
      - name: day_of_week
        description: Day of the week
        expr: day_of_week
        data_type: VARCHAR
        
      - name: is_weekend
        description: Whether it's a weekend
        expr: is_weekend
        data_type: BOOLEAN
        
      - name: is_game_day
        description: Whether it's a game day
        expr: is_game_day
        data_type: BOOLEAN

    measures:
      - name: total_ovens
        description: Total number of ovens
        expr: total_ovens
        data_type: NUMBER
        default_aggregation: sum
        
      - name: ovens_operational
        description: Number of operational ovens
        expr: ovens_operational
        data_type: NUMBER
        default_aggregation: sum
        synonyms: ['working ovens', 'available ovens']
        
      - name: oven_downtime_minutes
        description: Minutes of oven downtime
        expr: oven_downtime_minutes
        data_type: NUMBER
        default_aggregation: sum
        synonyms: ['downtime', 'oven downtime']
        
      - name: max_pizzas_per_hour
        description: Maximum pizza production capacity per hour
        expr: max_pizzas_per_hour
        data_type: NUMBER
        default_aggregation: sum
        
      - name: actual_pizzas_made
        description: Actual pizzas produced
        expr: actual_pizzas_made
        data_type: NUMBER
        default_aggregation: sum
        
      - name: thin_crust_capacity_pct
        description: Percentage of capacity available for thin-crust pizzas
        expr: thin_crust_capacity_pct
        data_type: NUMBER
        default_aggregation: sum
        synonyms: ['thin crust capacity', 'thin-crust availability']
        
      - name: pan_capacity_pct
        description: Percentage of capacity available for pan pizzas
        expr: pan_capacity_pct
        data_type: NUMBER
        default_aggregation: sum
        
      - name: stuffed_capacity_pct
        description: Percentage of capacity available for stuffed crust pizzas
        expr: stuffed_capacity_pct
        data_type: NUMBER
        default_aggregation: sum
        
      - name: kitchen_temp_f
        description: Kitchen/oven temperature in Fahrenheit
        expr: kitchen_temp_f
        data_type: NUMBER
        default_aggregation: sum
        synonyms: ['oven temperature', 'oven temp']
        
      - name: dough_quality_score
        description: Dough quality score (1-10 scale)
        expr: dough_quality_score
        data_type: NUMBER
        default_aggregation: sum
        synonyms: ['dough quality', 'dough score']

  # --------------------------------------------------------------------------
  # ORDER ITEMS - Product-level sales (CRITICAL for thin-crust vs pan analysis)
  # --------------------------------------------------------------------------
  - name: order_items
    description: |
      Individual line items from orders with product details. Each record represents
      a specific product purchased. Use this table to analyze product mix, crust type
      performance (thin-crust vs pan vs stuffed), and product-level revenue.
      CRITICAL: Use this table for questions about specific pizza types or crust styles.
    base_table:
      database: PIZZA_INTELLIGENCE
      schema: ANALYTICS
      table: V_ORDER_ITEMS
    
    dimensions:
      - name: order_item_id
        description: Unique identifier for each line item
        expr: order_item_id
        data_type: VARCHAR
        unique: true
        
      - name: order_id
        description: Parent order identifier
        expr: order_id
        data_type: VARCHAR
        
      - name: order_date
        description: Date when the order was placed
        expr: order_date
        data_type: DATE
        
      - name: product_id
        description: Product identifier
        expr: product_id
        data_type: VARCHAR
        
      - name: product_name
        description: Name of the product
        expr: product_name
        data_type: VARCHAR
        
      - name: product_category
        description: Product category (pizza, sides, drinks, desserts)
        expr: product_category
        data_type: VARCHAR
        sample_values: ['pizza', 'sides', 'drinks', 'desserts']
        
      - name: crust_type
        description: Type of crust for pizzas - thin_crust, pan, or stuffed. Use this for thin-crust vs pan pizza comparisons.
        expr: crust_type
        data_type: VARCHAR
        sample_values: ['thin_crust', 'pan', 'stuffed', 'combo', 'wings', 'salad', 'soda', 'breadsticks', 'cake', 'pastry']
        synonyms: ['crust', 'crust style', 'pizza type', 'subcategory']
        
      - name: product_size
        description: Size of the product
        expr: product_size
        data_type: VARCHAR
        sample_values: ['small', 'medium', 'large', 'family', 'regular']
        
      - name: store_id
        description: Store identifier
        expr: store_id
        data_type: VARCHAR
        
      - name: store_name
        description: Name of the store location
        expr: store_name
        data_type: VARCHAR
        
      - name: city
        description: City where the store is located
        expr: city
        data_type: VARCHAR
        sample_values: ['Phoenix', 'Chicago', 'New York', 'Los Angeles', 'Miami']
        
      - name: region
        description: Geographic region
        expr: region
        data_type: VARCHAR
        sample_values: ['Southwest', 'Midwest', 'Northeast', 'West', 'Southeast']
        
      - name: order_channel
        description: How the order was placed
        expr: order_channel
        data_type: VARCHAR
        sample_values: ['app', 'web', 'phone', 'in_store', 'third_party']
        
      - name: day_of_week
        description: Day of the week
        expr: day_of_week
        data_type: VARCHAR
        
      - name: is_weekend
        description: Whether the order was on a weekend
        expr: is_weekend
        data_type: BOOLEAN
        
      - name: is_game_day
        description: Whether the order was on a game day
        expr: is_game_day
        data_type: BOOLEAN

    time_dimensions:
      - name: order_timestamp
        description: Exact timestamp when the order was placed
        expr: order_timestamp
        data_type: TIMESTAMP_NTZ

    measures:
      - name: quantity
        description: Quantity of items sold
        expr: quantity
        data_type: NUMBER
        default_aggregation: sum
        synonyms: ['units sold', 'quantity sold', 'items sold']
        
      - name: line_total
        description: Revenue from product sales
        expr: line_total
        data_type: NUMBER
        default_aggregation: sum
        synonyms: ['sales', 'revenue', 'product revenue']
        
      - name: unit_price
        description: Unit price
        expr: unit_price
        data_type: NUMBER
        default_aggregation: sum

# ============================================================================
# VERIFIED QUERIES - Pre-validated queries for common questions
# ============================================================================
verified_queries:
  - name: thin_crust_vs_pan_performance
    question: Compare thin-crust vs pan-pizza sales performance
    sql: |
      SELECT 
        crust_type,
        COUNT(DISTINCT order_id) as total_orders,
        SUM(quantity) as units_sold,
        SUM(line_total) as total_revenue,
        AVG(line_total) as avg_revenue_per_item
      FROM PIZZA_INTELLIGENCE.ANALYTICS.V_ORDER_ITEMS
      WHERE product_category = 'pizza'
        AND order_date >= CURRENT_DATE() - 30
      GROUP BY crust_type
      ORDER BY total_revenue DESC

  - name: thin_crust_sales_by_city
    question: How are thin-crust pizza sales performing by city?
    sql: |
      SELECT 
        city,
        SUM(quantity) as units_sold,
        SUM(line_total) as total_revenue,
        COUNT(DISTINCT order_id) as orders_with_thin_crust
      FROM PIZZA_INTELLIGENCE.ANALYTICS.V_ORDER_ITEMS
      WHERE crust_type = 'thin_crust'
        AND order_date >= CURRENT_DATE() - 30
      GROUP BY city
      ORDER BY total_revenue DESC

  - name: daily_sales_summary
    question: What were our sales yesterday?
    sql: |
      SELECT 
        order_date,
        COUNT(DISTINCT order_id) as total_orders,
        SUM(total_amount) as total_revenue,
        AVG(total_amount) as avg_order_value
      FROM PIZZA_INTELLIGENCE.ANALYTICS.FACT_ORDERS
      WHERE order_date = CURRENT_DATE() - 1
      GROUP BY order_date
    
  - name: store_performance_comparison
    question: How are our stores performing this month?
    sql: |
      SELECT 
        s.store_name,
        s.city,
        COUNT(DISTINCT o.order_id) as total_orders,
        SUM(o.total_amount) as total_revenue,
        AVG(o.total_amount) as avg_order_value
      FROM PIZZA_INTELLIGENCE.ANALYTICS.FACT_ORDERS o
      JOIN PIZZA_INTELLIGENCE.ANALYTICS.DIM_STORES s ON o.store_id = s.store_id
      WHERE o.order_date >= DATE_TRUNC('month', CURRENT_DATE())
      GROUP BY s.store_name, s.city
      ORDER BY total_revenue DESC
    
  - name: late_delivery_analysis
    question: What's causing our late deliveries?
    sql: |
      SELECT 
        late_reason,
        COUNT(*) as late_count,
        AVG(late_minutes) as avg_minutes_late,
        COUNT(*) * 100.0 / SUM(COUNT(*)) OVER () as pct_of_late
      FROM PIZZA_INTELLIGENCE.ANALYTICS.FACT_DELIVERIES
      WHERE is_late = true
        AND delivery_date >= CURRENT_DATE() - 30
      GROUP BY late_reason
      ORDER BY late_count DESC
    
  - name: game_day_impact
    question: How do game days affect our sales?
    sql: |
      SELECT 
        c.is_game_day,
        CASE WHEN c.is_game_day THEN 'Game Day' ELSE 'Regular Day' END as day_type,
        COUNT(DISTINCT o.order_id) as total_orders,
        SUM(o.total_amount) as total_revenue,
        AVG(o.total_amount) as avg_order_value
      FROM PIZZA_INTELLIGENCE.ANALYTICS.FACT_ORDERS o
      JOIN PIZZA_INTELLIGENCE.ANALYTICS.DIM_CALENDAR c ON o.order_date = c.date_key
      WHERE o.order_date >= CURRENT_DATE() - 90
      GROUP BY c.is_game_day
      ORDER BY is_game_day DESC
    
  - name: campaign_roi_summary
    question: Which campaigns have the best ROI?
    sql: |
      SELECT 
        c.campaign_name,
        c.campaign_type,
        SUM(cp.revenue_attributed) as total_revenue,
        SUM(cp.discount_cost) as total_cost,
        SUM(cp.incremental_revenue) as incremental_revenue,
        AVG(cp.roi_percent) as avg_roi
      FROM PIZZA_INTELLIGENCE.ANALYTICS.FACT_CAMPAIGN_PERFORMANCE cp
      JOIN PIZZA_INTELLIGENCE.ANALYTICS.DIM_CAMPAIGNS c ON cp.campaign_id = c.campaign_id
      WHERE cp.performance_date >= CURRENT_DATE() - 30
      GROUP BY c.campaign_name, c.campaign_type
      ORDER BY avg_roi DESC
    
  - name: inventory_wastage
    question: How much inventory are we wasting?
    sql: |
      SELECT 
        ingredient_category,
        ingredient_name,
        SUM(wastage_units) as total_wasted,
        SUM(wastage_units * unit_cost) as wastage_cost
      FROM PIZZA_INTELLIGENCE.ANALYTICS.FACT_INVENTORY
      WHERE snapshot_date >= CURRENT_DATE() - 30
        AND wastage_units > 0
      GROUP BY ingredient_category, ingredient_name
      ORDER BY wastage_cost DESC
      LIMIT 10

  - name: thin_crust_chicago_analysis
    question: Why did thin-crust sales dip in Chicago?
    sql: |
      WITH store_orders AS (
        SELECT 
          oi.store_name,
          oi.city,
          SUM(CASE WHEN oi.crust_type = 'thin_crust' THEN oi.quantity ELSE 0 END) as thin_crust_qty,
          SUM(oi.quantity) as total_qty
        FROM PIZZA_INTELLIGENCE.ANALYTICS.V_ORDER_ITEMS oi
        WHERE oi.city = 'Chicago'
          AND oi.order_date >= CURRENT_DATE() - 7
        GROUP BY oi.store_name, oi.city
      ),
      capacity_data AS (
        SELECT 
          store_name,
          AVG(thin_crust_capacity_pct) as avg_thin_crust_capacity,
          AVG(ovens_operational) as avg_ovens_operational,
          MAX(downtime_reason) as downtime_reason
        FROM PIZZA_INTELLIGENCE.ANALYTICS.V_KITCHEN_CAPACITY
        WHERE city = 'Chicago'
          AND capacity_date >= CURRENT_DATE() - 7
        GROUP BY store_name
      )
      SELECT 
        so.store_name,
        so.city,
        so.thin_crust_qty,
        so.total_qty,
        cd.avg_thin_crust_capacity as thin_crust_capacity_pct,
        cd.avg_ovens_operational as ovens_working,
        cd.downtime_reason
      FROM store_orders so
      JOIN capacity_data cd ON so.store_name = cd.store_name
      ORDER BY cd.avg_thin_crust_capacity ASC

  - name: kitchen_capacity_by_city
    question: Which cities have kitchen capacity issues affecting orders?
    sql: |
      SELECT 
        kc.city,
        kc.store_name,
        AVG(kc.thin_crust_capacity_pct) as avg_thin_crust_capacity,
        AVG(kc.ovens_operational) as avg_ovens_working,
        MAX(kc.downtime_reason) as main_issue,
        COUNT(DISTINCT o.order_id) as recent_orders
      FROM PIZZA_INTELLIGENCE.ANALYTICS.V_KITCHEN_CAPACITY kc
      LEFT JOIN PIZZA_INTELLIGENCE.ANALYTICS.FACT_ORDERS o 
        ON kc.store_id = o.store_id 
        AND kc.capacity_date = o.order_date
      WHERE kc.capacity_date >= CURRENT_DATE() - 7
      GROUP BY kc.city, kc.store_name
      HAVING AVG(kc.thin_crust_capacity_pct) < 70
      ORDER BY avg_thin_crust_capacity ASC

  - name: friday_capacity_demand_gap
    question: Which stores had the biggest gap between demand and capacity last Friday?
    sql: |
      WITH friday_date AS (
        SELECT DATEADD(day, -MOD(DAYOFWEEK(CURRENT_DATE()) + 2, 7), CURRENT_DATE()) as last_friday
      ),
      orders_by_store AS (
        SELECT 
          o.store_id,
          s.store_name,
          s.city,
          COUNT(DISTINCT o.order_id) as order_count,
          SUM(o.total_amount) as revenue
        FROM PIZZA_INTELLIGENCE.ANALYTICS.FACT_ORDERS o
        JOIN PIZZA_INTELLIGENCE.ANALYTICS.DIM_STORES s ON o.store_id = s.store_id
        WHERE o.order_date = (SELECT last_friday FROM friday_date)
        GROUP BY o.store_id, s.store_name, s.city
      ),
      capacity_by_store AS (
        SELECT 
          store_id,
          AVG(max_pizzas_per_hour) as avg_max_capacity,
          AVG(actual_pizzas_made) as avg_actual_pizzas,
          AVG(thin_crust_capacity_pct) as avg_thin_capacity,
          MAX(downtime_reason) as main_issue
        FROM PIZZA_INTELLIGENCE.ANALYTICS.FACT_KITCHEN_CAPACITY
        WHERE capacity_date = (SELECT last_friday FROM friday_date)
        GROUP BY store_id
      )
      SELECT 
        obs.store_name,
        obs.city,
        obs.order_count,
        obs.revenue,
        cbs.avg_max_capacity,
        cbs.avg_actual_pizzas,
        cbs.avg_thin_capacity as thin_crust_capacity_pct,
        cbs.main_issue,
        (cbs.avg_max_capacity - cbs.avg_actual_pizzas) as unused_capacity
      FROM orders_by_store obs
      LEFT JOIN capacity_by_store cbs ON obs.store_id = cbs.store_id
      ORDER BY cbs.avg_thin_capacity ASC NULLS LAST


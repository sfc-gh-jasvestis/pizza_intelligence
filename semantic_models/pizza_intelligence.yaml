      - name: crust_type
        description: Type of crust for pizzas - thin_crust, pan, or stuffed. Use this for thin-crust vs pan pizza comparisons.
        expr: crust_type
        data_type: VARCHAR
        sample_values: ['thin_crust', 'pan', 'stuffed', 'combo', 'wings', 'salad', 'soda', 'breadsticks', 'cake', 'pastry']
        synonyms: ['crust', 'crust style', 'pizza type', 'subcategory']
        
      - name: product_size
        description: Size of the product
        expr: product_size
        data_type: VARCHAR
        sample_values: ['small', 'medium', 'large', 'family', 'regular']
        
      - name: store_id
        description: Store identifier
        expr: store_id
        data_type: VARCHAR
        
      - name: store_name
        description: Name of the store location
        expr: store_name
        data_type: VARCHAR
        
      - name: city
        description: City where the store is located
        expr: city
        data_type: VARCHAR
        sample_values: ['Phoenix', 'Chicago', 'New York', 'Los Angeles', 'Miami']
        
      - name: region
        description: Geographic region
        expr: region
        data_type: VARCHAR
        sample_values: ['Southwest', 'Midwest', 'Northeast', 'West', 'Southeast']
        
      - name: order_channel
        description: How the order was placed
        expr: order_channel
        data_type: VARCHAR
        sample_values: ['app', 'web', 'phone', 'in_store', 'third_party']
        
      - name: day_of_week
        description: Day of the week
        expr: day_of_week
        data_type: VARCHAR
        
      - name: is_weekend

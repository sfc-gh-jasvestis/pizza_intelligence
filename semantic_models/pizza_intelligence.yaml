    measures:
      - name: quantity
        description: Quantity of items sold
        expr: quantity
        data_type: NUMBER
        default_aggregation: sum
        synonyms: ['units sold', 'quantity sold', 'items sold']
        
      - name: line_total
        description: Revenue from product sales
        expr: line_total
        data_type: NUMBER
        default_aggregation: sum
        synonyms: ['sales', 'revenue', 'product revenue']
        
      - name: unit_price
        description: Unit price
        expr: unit_price
        data_type: NUMBER
        default_aggregation: sum

# ============================================================================
# VERIFIED QUERIES - Pre-validated queries for common questions
# ============================================================================
verified_queries:
  - name: sales_comparison_last_night
    question: "For Chicago Loop: Why were my sales lower than usual last night in this store?"
    verified_by: Jonathan Vestin
    verified_at: 1737500000
    sql: |
      SELECT 
        TO_CHAR(order_date, 'Mon DD') as "Date",
        DAYNAME(order_date) as "Day",
        COUNT(*) as "Orders",
        ROUND(SUM(total_amount), 0) as "Revenue ($)",
        weather_condition as "Weather",
        CASE WHEN is_game_day THEN game_event ELSE '-' END as "Event"
      FROM PIZZA_INTELLIGENCE.ANALYTICS.V_ORDERS
      WHERE store_name = 'Chicago Loop'
        AND order_date >= CURRENT_DATE() - 14
      GROUP BY order_date, weather_condition, is_game_day, game_event
      ORDER BY order_date ASC

  - name: friday_shift_prep
    question: "For Chicago Loop: What should I get ready for this Friday night shift?"
    verified_by: Jonathan Vestin
    verified_at: 1737500000
    use_as_onboarding_question: true
    sql: |
      SELECT 
        TO_CHAR(order_date, 'Mon DD') as "Friday",
        COUNT(*) as "Orders",
        ROUND(SUM(total_amount), 0) as "Revenue ($)",
        ROUND(AVG(total_amount), 2) as "Avg Order ($)",
        weather_condition as "Weather",
        CASE WHEN is_game_day THEN '🏀 ' || game_event ELSE '-' END as "Event"
      FROM PIZZA_INTELLIGENCE.ANALYTICS.V_ORDERS
      WHERE store_name = 'Chicago Loop'
        AND DAYNAME(order_date) = 'Fri'
        AND order_date >= CURRENT_DATE() - 35
      GROUP BY order_date, weather_condition, is_game_day, game_event
      ORDER BY order_date ASC

  - name: friday_night_forecast
    question: "For Chicago Loop: How many orders do we typically get on Friday nights? What was our revenue last Friday?"
    verified_by: Jonathan Vestin
    verified_at: 1737500000
    sql: |
      WITH friday_stats AS (
        SELECT 
          order_date,
          COUNT(*) as orders,
          SUM(total_amount) as revenue
        FROM PIZZA_INTELLIGENCE.ANALYTICS.V_ORDERS
        WHERE store_name = 'Chicago Loop'
          AND DAYNAME(order_date) = 'Fri'
          AND order_date >= CURRENT_DATE() - 60
        GROUP BY order_date
      ),
      last_friday AS (
        SELECT MAX(order_date) as last_fri FROM friday_stats
      )
      SELECT 
        'Typical Friday' as "Period",
        ROUND(AVG(orders)) as "Orders",
        ROUND(AVG(revenue), 0) as "Revenue ($)"
      FROM friday_stats
      UNION ALL
      SELECT 
        'Last Friday (' || TO_CHAR(last_fri, 'Mon DD') || ')' as "Period",
        orders as "Orders",
        ROUND(revenue, 0) as "Revenue ($)"
      FROM friday_stats, last_friday
      WHERE order_date = last_fri

  - name: delivery_trend_analysis
    question: "For Chicago Loop: Show me my delivery performance by week for the last month"
    verified_by: Jonathan Vestin
    verified_at: 1737500000
    sql: |
      SELECT 
        TO_CHAR(DATE_TRUNC('week', delivery_date)::DATE, 'Mon DD') as "Week",
        COUNT(*) as "Total Deliveries",
        SUM(CASE WHEN is_late THEN 1 ELSE 0 END) as "Late Deliveries",
        ROUND(SUM(CASE WHEN is_late THEN 1 ELSE 0 END) * 100.0 / COUNT(*), 1) as "Late %",
        ROUND(AVG(delivery_duration_min), 0) as "Avg Time (min)"
      FROM PIZZA_INTELLIGENCE.ANALYTICS.V_DELIVERIES
      WHERE store_name = 'Chicago Loop'
        AND delivery_date >= CURRENT_DATE() - 28
      GROUP BY DATE_TRUNC('week', delivery_date)
      ORDER BY DATE_TRUNC('week', delivery_date) ASC

  - name: top_fixes_this_week
    question: "For Chicago Loop: What are the top things I should fix this week to improve operations?"
    verified_by: Jonathan Vestin
    verified_at: 1737500000
    sql: |
      -- Combines key issues from deliveries, kitchen, and sales into actionable priorities
      SELECT priority as "Priority", area as "Area", issue as "Issue", metric as "Current Metric", action as "Recommended Action"
      FROM (
        -- Delivery late rate
        SELECT 1 as priority, '🚚 Delivery' as area, 
               'High late delivery rate' as issue,
               ROUND(SUM(CASE WHEN is_late THEN 1 ELSE 0 END) * 100.0 / COUNT(*), 1) || '% late rate' as metric,
               'Schedule extra drivers for peak hours (5-8pm)' as action
        FROM PIZZA_INTELLIGENCE.ANALYTICS.V_DELIVERIES
        WHERE store_name = 'Chicago Loop' AND delivery_date >= CURRENT_DATE() - 7
        
        UNION ALL
        
        -- Traffic delays specifically
        SELECT 2 as priority, '🚗 Delivery' as area,
               'Traffic causing delays' as issue,
               COUNT(*) || ' traffic-related late deliveries' as metric,
               'Use alternate routes, pre-position drivers near hotspots' as action
        FROM PIZZA_INTELLIGENCE.ANALYTICS.V_DELIVERIES
        WHERE store_name = 'Chicago Loop' AND delivery_date >= CURRENT_DATE() - 7 AND LOWER(late_reason) = 'traffic'
        
        UNION ALL
        
        -- Kitchen equipment issues  
        SELECT 3 as priority, '🍕 Kitchen' as area,
               'Equipment downtime' as issue,
               SUM(oven_downtime_minutes) || ' min lost this week' as metric,
               'Schedule preventive maintenance for Oven 2' as action
        FROM PIZZA_INTELLIGENCE.ANALYTICS.V_KITCHEN_CAPACITY
        WHERE store_name = 'Chicago Loop' AND capacity_date >= CURRENT_DATE() - 7
        
        UNION ALL
        
        -- Low customer ratings
        SELECT 4 as priority, '⭐ Quality' as area,
               'Customer ratings declining' as issue,
               ROUND(AVG(customer_rating), 2) || ' avg rating (target: 4.5)' as metric,
               'Focus on order accuracy and hot delivery' as action
        FROM PIZZA_INTELLIGENCE.ANALYTICS.V_DELIVERIES
        WHERE store_name = 'Chicago Loop' AND delivery_date >= CURRENT_DATE() - 7
        
        UNION ALL
        
        -- Revenue trend
        SELECT 5 as priority, '💰 Sales' as area,
               'Revenue below target' as issue,
               '$' || TO_CHAR(SUM(total_amount), '999,999') || ' (7-day total)' as metric,
               'Run game day promos, upsell combos' as action
        FROM PIZZA_INTELLIGENCE.ANALYTICS.V_ORDERS
        WHERE store_name = 'Chicago Loop' AND order_date >= CURRENT_DATE() - 7
      )
      ORDER BY priority

  - name: kitchen_capacity_weekly
    question: What is my kitchen capacity and are there equipment issues?
    sql: |
      SELECT 
        capacity_date as "Date",
        DAYNAME(capacity_date) as "Day",
        MIN(ovens_operational) || ' / ' || MAX(total_ovens) as "Ovens Working",
        ROUND(SUM(actual_pizzas_made) * 100.0 / NULLIF(SUM(max_pizzas_per_hour), 0), 0) || '%' as "Utilization",
        SUM(oven_downtime_minutes) as "Downtime (min)",
        COALESCE(LISTAGG(DISTINCT NULLIF(downtime_reason, ''), '; '), 'None') as "Equipment Issues"
      FROM PIZZA_INTELLIGENCE.ANALYTICS.V_KITCHEN_CAPACITY
      WHERE store_name = 'Chicago Loop'
        AND capacity_date >= CURRENT_DATE() - 7
      GROUP BY capacity_date
      ORDER BY capacity_date DESC

  - name: store_delivery_performance
    question: Show me delivery performance for a specific store like Chicago Loop
    sql: |
      SELECT 
        store_name,
        delivery_date,
        COUNT(*) as total_deliveries,
        SUM(CASE WHEN is_late THEN 1 ELSE 0 END) as late_deliveries,
        ROUND(SUM(CASE WHEN is_late THEN 1 ELSE 0 END) * 100.0 / COUNT(*), 1) as late_pct,
        ROUND(AVG(delivery_duration_min), 1) as avg_duration_min
      FROM PIZZA_INTELLIGENCE.ANALYTICS.V_DELIVERIES
      WHERE store_name = 'Chicago Loop'  -- Use store_name not city
        AND delivery_date >= CURRENT_DATE() - 7
      GROUP BY store_name, delivery_date
      ORDER BY delivery_date DESC

  - name: store_comparison_delivery
    question: How does my store compare to other stores for delivery performance?
    sql: |
      SELECT 
        store_name as "Store",
        COUNT(*) as "Deliveries",
        SUM(CASE WHEN is_late THEN 1 ELSE 0 END) as "Late",
        ROUND(SUM(CASE WHEN is_late THEN 1 ELSE 0 END) * 100.0 / COUNT(*), 1) || '%' as "Late %",
        ROUND(AVG(delivery_duration_min), 1) || ' min' as "Avg Time",
        CASE 
          WHEN store_name = 'Chicago Loop' THEN '⭐ Your Store'
          ELSE ''
        END as "Note"
      FROM PIZZA_INTELLIGENCE.ANALYTICS.V_DELIVERIES
      WHERE delivery_date >= CURRENT_DATE() - 14
      GROUP BY store_name
      ORDER BY SUM(CASE WHEN is_late THEN 1 ELSE 0 END) * 100.0 / COUNT(*) DESC

  - name: store_late_reasons
    question: What's causing late deliveries at a specific store?
    sql: |
      SELECT 
        store_name,
        late_reason,
        COUNT(*) as late_count,
        ROUND(COUNT(*) * 100.0 / SUM(COUNT(*)) OVER (), 1) as pct_of_late
      FROM PIZZA_INTELLIGENCE.ANALYTICS.V_DELIVERIES
      WHERE store_name = 'Chicago Loop'  -- Filter by store_name
        AND is_late = TRUE
        AND delivery_date >= CURRENT_DATE() - 7
      GROUP BY store_name, late_reason
      ORDER BY late_count DESC

  - name: thin_crust_vs_pan_performance
    question: Compare thin-crust vs pan-pizza sales performance
    sql: |
      SELECT 
        crust_type,
        COUNT(DISTINCT order_id) as total_orders,
        SUM(quantity) as units_sold,
        SUM(line_total) as total_revenue,
        AVG(line_total) as avg_revenue_per_item
      FROM PIZZA_INTELLIGENCE.ANALYTICS.V_ORDER_ITEMS
      WHERE product_category = 'pizza'
        AND order_date >= CURRENT_DATE() - 30
      GROUP BY crust_type
      ORDER BY total_revenue DESC

  - name: thin_crust_sales_by_city
    question: How are thin-crust pizza sales performing by city?
    sql: |
      SELECT 
        city,
        SUM(quantity) as units_sold,
        SUM(line_total) as total_revenue,
        COUNT(DISTINCT order_id) as orders_with_thin_crust
      FROM PIZZA_INTELLIGENCE.ANALYTICS.V_ORDER_ITEMS
      WHERE crust_type = 'thin_crust'
        AND order_date >= CURRENT_DATE() - 30
      GROUP BY city
      ORDER BY total_revenue DESC

  - name: daily_sales_summary
    question: What were our sales yesterday?
    sql: |
      SELECT 
        order_date,
        COUNT(DISTINCT order_id) as total_orders,
        SUM(total_amount) as total_revenue,
        AVG(total_amount) as avg_order_value
      FROM PIZZA_INTELLIGENCE.ANALYTICS.FACT_ORDERS
      WHERE order_date = CURRENT_DATE() - 1
      GROUP BY order_date
    
  - name: store_performance_comparison
    question: How are our stores performing this month?
    sql: |
      SELECT 
        s.store_name,
        s.city,
        COUNT(DISTINCT o.order_id) as total_orders,
        SUM(o.total_amount) as total_revenue,
        AVG(o.total_amount) as avg_order_value
      FROM PIZZA_INTELLIGENCE.ANALYTICS.FACT_ORDERS o
      JOIN PIZZA_INTELLIGENCE.ANALYTICS.DIM_STORES s ON o.store_id = s.store_id
      WHERE o.order_date >= DATE_TRUNC('month', CURRENT_DATE())
      GROUP BY s.store_name, s.city
      ORDER BY total_revenue DESC
    
  - name: late_delivery_analysis
    question: What's causing our late deliveries?
    sql: |
      SELECT 
        late_reason,
        COUNT(*) as late_count,
        AVG(late_minutes) as avg_minutes_late,
        COUNT(*) * 100.0 / SUM(COUNT(*)) OVER () as pct_of_late
      FROM PIZZA_INTELLIGENCE.ANALYTICS.FACT_DELIVERIES
      WHERE is_late = true
        AND delivery_date >= CURRENT_DATE() - 30
      GROUP BY late_reason
      ORDER BY late_count DESC
    
  - name: game_day_impact
    question: How do game days affect our sales?
    sql: |
      SELECT 
        c.is_game_day,
        CASE WHEN c.is_game_day THEN 'Game Day' ELSE 'Regular Day' END as day_type,
        COUNT(DISTINCT o.order_id) as total_orders,
        SUM(o.total_amount) as total_revenue,
        AVG(o.total_amount) as avg_order_value
      FROM PIZZA_INTELLIGENCE.ANALYTICS.FACT_ORDERS o
      JOIN PIZZA_INTELLIGENCE.ANALYTICS.DIM_CALENDAR c ON o.order_date = c.date_key
      WHERE o.order_date >= CURRENT_DATE() - 90
      GROUP BY c.is_game_day
      ORDER BY is_game_day DESC
    
  - name: campaign_roi_summary
    question: Which campaigns have the best ROI?
    sql: |
      SELECT 
        c.campaign_name,
        c.campaign_type,
        SUM(cp.revenue_attributed) as total_revenue,
        SUM(cp.discount_cost) as total_cost,
        SUM(cp.incremental_revenue) as incremental_revenue,
        AVG(cp.roi_percent) as avg_roi
      FROM PIZZA_INTELLIGENCE.ANALYTICS.FACT_CAMPAIGN_PERFORMANCE cp
      JOIN PIZZA_INTELLIGENCE.ANALYTICS.DIM_CAMPAIGNS c ON cp.campaign_id = c.campaign_id
      WHERE cp.performance_date >= CURRENT_DATE() - 30
      GROUP BY c.campaign_name, c.campaign_type
      ORDER BY avg_roi DESC
    
  - name: inventory_wastage
    question: How much inventory are we wasting?
    sql: |
      SELECT 
        ingredient_category,
        ingredient_name,
        SUM(wastage_units) as total_wasted,
        SUM(wastage_units * unit_cost) as wastage_cost
      FROM PIZZA_INTELLIGENCE.ANALYTICS.FACT_INVENTORY
      WHERE snapshot_date >= CURRENT_DATE() - 30
        AND wastage_units > 0
      GROUP BY ingredient_category, ingredient_name
      ORDER BY wastage_cost DESC
      LIMIT 10

  - name: thin_crust_chicago_analysis
    question: Why did thin-crust sales dip in Chicago?
    sql: |
      WITH store_orders AS (
        SELECT 
          oi.store_name,
          oi.city,
          SUM(CASE WHEN oi.crust_type = 'thin_crust' THEN oi.quantity ELSE 0 END) as thin_crust_qty,
          SUM(oi.quantity) as total_qty
        FROM PIZZA_INTELLIGENCE.ANALYTICS.V_ORDER_ITEMS oi
        WHERE oi.city = 'Chicago'
          AND oi.order_date >= CURRENT_DATE() - 7
        GROUP BY oi.store_name, oi.city
      ),
      capacity_data AS (
        SELECT 
          store_name,
          AVG(thin_crust_capacity_pct) as avg_thin_crust_capacity,
          AVG(ovens_operational) as avg_ovens_operational,
          MAX(downtime_reason) as downtime_reason
        FROM PIZZA_INTELLIGENCE.ANALYTICS.V_KITCHEN_CAPACITY
        WHERE city = 'Chicago'
          AND capacity_date >= CURRENT_DATE() - 7
        GROUP BY store_name
      )
      SELECT 
        so.store_name,
        so.city,
        so.thin_crust_qty,
        so.total_qty,
        cd.avg_thin_crust_capacity as thin_crust_capacity_pct,
        cd.avg_ovens_operational as ovens_working,
        cd.downtime_reason
      FROM store_orders so
      JOIN capacity_data cd ON so.store_name = cd.store_name
      ORDER BY cd.avg_thin_crust_capacity ASC

  - name: kitchen_capacity_by_city
    question: Which cities have kitchen capacity issues affecting orders?
    sql: |
      SELECT 
        kc.city,
        kc.store_name,
        AVG(kc.thin_crust_capacity_pct) as avg_thin_crust_capacity,
        AVG(kc.ovens_operational) as avg_ovens_working,
        MAX(kc.downtime_reason) as main_issue,
        COUNT(DISTINCT o.order_id) as recent_orders
      FROM PIZZA_INTELLIGENCE.ANALYTICS.V_KITCHEN_CAPACITY kc
      LEFT JOIN PIZZA_INTELLIGENCE.ANALYTICS.FACT_ORDERS o 
        ON kc.store_id = o.store_id 
        AND kc.capacity_date = o.order_date
      WHERE kc.capacity_date >= CURRENT_DATE() - 7
      GROUP BY kc.city, kc.store_name
      HAVING AVG(kc.thin_crust_capacity_pct) < 70
      ORDER BY avg_thin_crust_capacity ASC

  - name: friday_capacity_demand_gap
    question: Which stores had the biggest gap between demand and capacity last Friday?
    sql: |
      WITH friday_date AS (
        SELECT DATEADD(day, -MOD(DAYOFWEEK(CURRENT_DATE()) + 2, 7), CURRENT_DATE()) as last_friday
      ),
      orders_by_store AS (
        SELECT 
          o.store_id,
          s.store_name,
          s.city,
          COUNT(DISTINCT o.order_id) as order_count,
          SUM(o.total_amount) as revenue
        FROM PIZZA_INTELLIGENCE.ANALYTICS.FACT_ORDERS o
        JOIN PIZZA_INTELLIGENCE.ANALYTICS.DIM_STORES s ON o.store_id = s.store_id
        WHERE o.order_date = (SELECT last_friday FROM friday_date)
        GROUP BY o.store_id, s.store_name, s.city
      ),
      capacity_by_store AS (
        SELECT 
          store_id,
          AVG(max_pizzas_per_hour) as avg_max_capacity,
          AVG(actual_pizzas_made) as avg_actual_pizzas,
          AVG(thin_crust_capacity_pct) as avg_thin_capacity,
          MAX(downtime_reason) as main_issue
        FROM PIZZA_INTELLIGENCE.ANALYTICS.FACT_KITCHEN_CAPACITY
        WHERE capacity_date = (SELECT last_friday FROM friday_date)
        GROUP BY store_id
      )
      SELECT 
        obs.store_name,
        obs.city,
        obs.order_count,
        obs.revenue,
        cbs.avg_max_capacity,
        cbs.avg_actual_pizzas,
        cbs.avg_thin_capacity as thin_crust_capacity_pct,
        cbs.main_issue,
        (cbs.avg_max_capacity - cbs.avg_actual_pizzas) as unused_capacity
      FROM orders_by_store obs
      LEFT JOIN capacity_by_store cbs ON obs.store_id = cbs.store_id
      ORDER BY cbs.avg_thin_capacity ASC NULLS LAST

  - name: city_capacity_gap_last_friday
    question: Across all stores last Friday, which cities saw the biggest gap between order demand and kitchen capacity, and why?
    sql: |
      WITH friday_date AS (
        SELECT DATEADD(day, -MOD(DAYOFWEEK(CURRENT_DATE()) + 2, 7), CURRENT_DATE()) as last_friday
      ),
      city_orders AS (
        SELECT 
          s.city,
          COUNT(DISTINCT o.order_id) as total_orders,
          SUM(o.total_amount) as total_revenue
        FROM PIZZA_INTELLIGENCE.ANALYTICS.FACT_ORDERS o
        JOIN PIZZA_INTELLIGENCE.ANALYTICS.DIM_STORES s ON o.store_id = s.store_id
        WHERE o.order_date = (SELECT last_friday FROM friday_date)
        GROUP BY s.city
      ),
      city_capacity AS (
        SELECT 
          kc.city,
          MIN(kc.thin_crust_capacity_pct) as min_thin_crust_capacity,
          AVG(kc.ovens_operational) as avg_ovens_working,
          AVG(kc.total_ovens) as total_ovens,
          LISTAGG(DISTINCT kc.downtime_reason, '; ') as capacity_issues
        FROM PIZZA_INTELLIGENCE.ANALYTICS.V_KITCHEN_CAPACITY kc
        WHERE kc.capacity_date = (SELECT last_friday FROM friday_date)
        GROUP BY kc.city
      )
      SELECT 
        co.city,
        co.total_orders as order_demand,
        ROUND(co.total_revenue, 0) as total_revenue,
        cc.min_thin_crust_capacity as thin_crust_capacity_pct,
        ROUND(cc.avg_ovens_working, 0) as ovens_working,
        ROUND(cc.total_ovens, 0) as total_ovens,
        cc.capacity_issues as why_capacity_constrained
      FROM city_orders co
      LEFT JOIN city_capacity cc ON co.city = cc.city
      ORDER BY cc.min_thin_crust_capacity ASC NULLS LAST

  - name: capacity_gap_by_city
    question: Show me the capacity gap by city for last Friday
    sql: |
      WITH friday_date AS (
        SELECT DATEADD(day, -MOD(DAYOFWEEK(CURRENT_DATE()) + 2, 7), CURRENT_DATE()) as last_friday
      )
      SELECT 
        kc.city,
        MIN(kc.thin_crust_capacity_pct) as thin_crust_capacity_pct,
        ROUND(AVG(kc.ovens_operational), 0) as ovens_working,
        ROUND(AVG(kc.total_ovens), 0) as total_ovens,
        LISTAGG(DISTINCT kc.downtime_reason, '; ') WITHIN GROUP (ORDER BY kc.downtime_reason) as equipment_issues
      FROM PIZZA_INTELLIGENCE.ANALYTICS.V_KITCHEN_CAPACITY kc
      WHERE kc.capacity_date = (SELECT last_friday FROM friday_date)
      GROUP BY kc.city
      ORDER BY thin_crust_capacity_pct ASC NULLS LAST

  - name: delivery_trend_vs_revenue
    question: Show me stores where delivery time has been worsening over the last 4 Fridays but revenue hasn't dropped yet
    sql: |
      WITH fridays AS (
        SELECT DISTINCT order_date as friday_date
        FROM PIZZA_INTELLIGENCE.ANALYTICS.FACT_ORDERS
        WHERE DAYNAME(order_date) = 'Fri'
          AND order_date >= CURRENT_DATE() - 28
        ORDER BY order_date DESC
        LIMIT 4
      ),
      delivery_by_week AS (
        SELECT 
          d.store_id,
          s.store_name,
          s.city,
          d.delivery_date,
          AVG(d.delivery_duration_min) as avg_delivery_time,
          SUM(CASE WHEN d.is_late THEN 1 ELSE 0 END) * 100.0 / COUNT(*) as late_pct,
          SUM(o.total_amount) as revenue
        FROM PIZZA_INTELLIGENCE.ANALYTICS.FACT_DELIVERIES d
        JOIN PIZZA_INTELLIGENCE.ANALYTICS.DIM_STORES s ON d.store_id = s.store_id
        JOIN PIZZA_INTELLIGENCE.ANALYTICS.FACT_ORDERS o ON d.order_id = o.order_id
        WHERE d.delivery_date IN (SELECT friday_date FROM fridays)
        GROUP BY d.store_id, s.store_name, s.city, d.delivery_date
      ),
      trends AS (
        SELECT 
          store_name,
          city,
          MIN(avg_delivery_time) as earliest_delivery_time,
          MAX(avg_delivery_time) as latest_delivery_time,
          MAX(avg_delivery_time) - MIN(avg_delivery_time) as delivery_time_increase,
          MIN(revenue) as earliest_revenue,
          MAX(revenue) as latest_revenue
        FROM delivery_by_week
        GROUP BY store_name, city
      )
      SELECT 
        store_name,
        city,
        ROUND(earliest_delivery_time, 1) as delivery_time_4_weeks_ago,
        ROUND(latest_delivery_time, 1) as delivery_time_last_friday,
        ROUND(delivery_time_increase, 1) as delivery_time_increase_minutes,
        earliest_revenue as revenue_4_weeks_ago,
        latest_revenue as revenue_last_friday,
        CASE WHEN latest_revenue >= earliest_revenue THEN 'Revenue stable despite delays' ELSE 'Revenue declining' END as risk_status
      FROM trends
      WHERE delivery_time_increase > 0
      ORDER BY delivery_time_increase DESC

  - name: thin_crust_vs_pan_by_channel
    question: Compare thin-crust vs pan-pizza performance across channels over the last 8 weeks
    sql: |
      SELECT 
        oi.crust_type,
        o.order_channel as channel,
        COUNT(DISTINCT oi.order_id) as total_orders,
        SUM(oi.quantity) as units_sold,
        ROUND(SUM(oi.line_total), 2) as total_revenue,
        ROUND(AVG(oi.line_total), 2) as avg_order_value
      FROM PIZZA_INTELLIGENCE.ANALYTICS.V_ORDER_ITEMS oi
      JOIN PIZZA_INTELLIGENCE.ANALYTICS.FACT_ORDERS o ON oi.order_id = o.order_id
      WHERE oi.crust_type IN ('thin_crust', 'pan')
        AND oi.order_date >= CURRENT_DATE() - 56
      GROUP BY oi.crust_type, o.order_channel
      ORDER BY oi.crust_type, total_revenue DESC

  - name: late_delivery_causes_last_friday
    question: Which stores had the highest late delivery rates last Friday and what were the main causes?
    sql: |
      WITH friday_date AS (
        SELECT DATEADD(day, -MOD(DAYOFWEEK(CURRENT_DATE()) + 2, 7), CURRENT_DATE()) as last_friday
      )
      SELECT 
        s.store_name,
        s.city,
        COUNT(*) as total_deliveries,
        SUM(CASE WHEN d.is_late THEN 1 ELSE 0 END) as late_deliveries,
        ROUND(SUM(CASE WHEN d.is_late THEN 1 ELSE 0 END) * 100.0 / COUNT(*), 1) as late_delivery_pct,
        AVG(d.delivery_duration_min) as avg_delivery_time_minutes,
        MODE(d.late_reason) as most_common_delay_reason
      FROM PIZZA_INTELLIGENCE.ANALYTICS.FACT_DELIVERIES d
      JOIN PIZZA_INTELLIGENCE.ANALYTICS.DIM_STORES s ON d.store_id = s.store_id
      WHERE d.delivery_date = (SELECT last_friday FROM friday_date)
      GROUP BY s.store_name, s.city
      ORDER BY late_delivery_pct DESC

  - name: friday_inventory_patterns
    question: Based on historical Friday patterns, which stores should prepare extra inventory this week?
    sql: |
      WITH friday_orders AS (
        SELECT 
          o.store_id,
          s.store_name,
          s.city,
          AVG(o.item_count) as avg_items_per_order,
          COUNT(*) as friday_orders,
          SUM(o.total_amount) as friday_revenue
        FROM PIZZA_INTELLIGENCE.ANALYTICS.FACT_ORDERS o
        JOIN PIZZA_INTELLIGENCE.ANALYTICS.DIM_STORES s ON o.store_id = s.store_id
        WHERE DAYNAME(o.order_date) = 'Fri'
          AND o.order_date >= CURRENT_DATE() - 28
        GROUP BY o.store_id, s.store_name, s.city
      )
      SELECT 
        store_name,
        city,
        friday_orders as typical_friday_orders,
        ROUND(friday_revenue, 0) as typical_friday_revenue,
        ROUND(avg_items_per_order, 1) as avg_items_per_order,
        ROUND(friday_orders * avg_items_per_order * 1.2, 0) as recommended_prep_units,
        CASE 
          WHEN friday_orders > 100 THEN 'HIGH PRIORITY - Major Friday volume, prep 20% extra'
          WHEN friday_orders > 50 THEN 'MEDIUM - Standard Friday prep with buffer'
          ELSE 'NORMAL - Standard prep levels'
        END as prep_recommendation
      FROM friday_orders
      ORDER BY friday_revenue DESC
      LIMIT 10

  - name: total_revenue_at_risk
    question: How much revenue are we losing across all stores with kitchen capacity issues?
    sql: |
      WITH store_metrics AS (
        SELECT 
          s.store_name,
          s.city,
          COUNT(DISTINCT o.order_id) as total_orders,
          ROUND(SUM(o.total_amount), 0) as total_revenue
        FROM PIZZA_INTELLIGENCE.ANALYTICS.FACT_ORDERS o
        JOIN PIZZA_INTELLIGENCE.ANALYTICS.DIM_STORES s ON o.store_id = s.store_id
        WHERE o.order_date >= CURRENT_DATE() - 30
        GROUP BY s.store_name, s.city
      ),
      capacity_issues AS (
        SELECT 
          city,
          store_name,
          MIN(thin_crust_capacity_pct) as capacity_pct,
          ROUND(AVG(ovens_operational), 0) as ovens_working,
          ROUND(AVG(total_ovens), 0) as total_ovens,
          LISTAGG(DISTINCT downtime_reason, '; ') as equipment_issues
        FROM PIZZA_INTELLIGENCE.ANALYTICS.V_KITCHEN_CAPACITY
        WHERE capacity_date >= CURRENT_DATE() - 7
          AND thin_crust_capacity_pct < 80
        GROUP BY city, store_name
      )
      SELECT 
        ci.city,
        sm.store_name,
        ci.capacity_pct,
        ci.ovens_working || '/' || ci.total_ovens as ovens_status,
        sm.total_revenue as monthly_revenue,
        ROUND(sm.total_revenue * (100 - ci.capacity_pct) / 100 * 0.3, 0) as estimated_lost_revenue,
        ci.equipment_issues as root_cause
      FROM capacity_issues ci
      JOIN store_metrics sm ON ci.store_name = sm.store_name
      ORDER BY estimated_lost_revenue DESC

  - name: stores_in_crisis
    question: Which stores are in crisis mode right now and what's causing it?
    sql: |
      WITH capacity_crisis AS (
        SELECT 
          city,
          store_name,
          MIN(thin_crust_capacity_pct) as capacity_pct,
          LISTAGG(DISTINCT downtime_reason, '; ') as equipment_issues
        FROM PIZZA_INTELLIGENCE.ANALYTICS.V_KITCHEN_CAPACITY
        WHERE capacity_date >= CURRENT_DATE() - 7
          AND thin_crust_capacity_pct < 75
        GROUP BY city, store_name
      ),
      delivery_crisis AS (
        SELECT 
          s.city,
          s.store_name,
          ROUND(SUM(CASE WHEN d.is_late THEN 1 ELSE 0 END) * 100.0 / COUNT(*), 1) as late_pct,
          ROUND(AVG(d.delivery_duration_min), 1) as avg_delivery_min,
          MODE(d.late_reason) as main_delay_reason
        FROM PIZZA_INTELLIGENCE.ANALYTICS.FACT_DELIVERIES d
        JOIN PIZZA_INTELLIGENCE.ANALYTICS.DIM_STORES s ON d.store_id = s.store_id
        WHERE d.delivery_date >= CURRENT_DATE() - 14
        GROUP BY s.city, s.store_name
        HAVING SUM(CASE WHEN d.is_late THEN 1 ELSE 0 END) * 100.0 / COUNT(*) > 25
      )
      SELECT 
        COALESCE(cc.city, dc.city) as city,
        COALESCE(cc.store_name, dc.store_name) as store_name,
        cc.capacity_pct as kitchen_capacity_pct,
        dc.late_pct as late_delivery_pct,
        dc.avg_delivery_min,
        CASE 
          WHEN cc.capacity_pct IS NOT NULL AND dc.late_pct IS NOT NULL THEN 'CRITICAL - Capacity AND Delivery crisis'
          WHEN cc.capacity_pct IS NOT NULL THEN 'HIGH - Kitchen capacity crisis'
          WHEN dc.late_pct IS NOT NULL THEN 'HIGH - Delivery crisis'
        END as crisis_level,
        COALESCE(cc.equipment_issues, '') as equipment_issues,
        COALESCE(dc.main_delay_reason, '') as delivery_issues
      FROM capacity_crisis cc
      FULL OUTER JOIN delivery_crisis dc ON cc.store_name = dc.store_name
      ORDER BY 
        CASE WHEN cc.capacity_pct IS NOT NULL AND dc.late_pct IS NOT NULL THEN 1
             WHEN cc.capacity_pct IS NOT NULL THEN 2
             ELSE 3 END,
        COALESCE(cc.capacity_pct, 100) ASC

  - name: complaint_themes_summary
    question: Summarize customer complaint themes from recent reviews and map them to operational issues
    sql: |
      SELECT 
        s.city,
        s.store_name,
        AVG(d.customer_rating) as avg_delivery_rating,
        SUM(CASE WHEN d.is_late THEN 1 ELSE 0 END) * 100.0 / COUNT(*) as late_pct,
        AVG(d.delivery_duration_min) as avg_delivery_time,
        CASE 
          WHEN AVG(d.delivery_duration_min) > 30 THEN 'DELIVERY: Long delivery times - check routing and staffing'
          WHEN SUM(CASE WHEN d.is_late THEN 1 ELSE 0 END) * 100.0 / COUNT(*) > 20 THEN 'DELIVERY: High late rate - investigate causes'
          WHEN AVG(d.customer_rating) < 3.5 THEN 'QUALITY: Low ratings - review food quality and service'
          ELSE 'OPERATIONAL: Performance acceptable'
        END as primary_issue_category,
        MODE(d.late_reason) as common_delay_reason
      FROM PIZZA_INTELLIGENCE.ANALYTICS.FACT_DELIVERIES d
      JOIN PIZZA_INTELLIGENCE.ANALYTICS.DIM_STORES s ON d.store_id = s.store_id
      WHERE d.delivery_date >= CURRENT_DATE() - 30
      GROUP BY s.city, s.store_name
      ORDER BY avg_delivery_rating ASC

  - name: sales_by_city_last_week
    question: What were our total sales last week by city?
    sql: |
      SELECT 
        s.city,
        COUNT(DISTINCT o.order_id) as total_orders,
        ROUND(SUM(o.total_amount), 2) as total_revenue,
        ROUND(AVG(o.total_amount), 2) as avg_order_value,
        COUNT(DISTINCT o.store_id) as stores
      FROM PIZZA_INTELLIGENCE.ANALYTICS.FACT_ORDERS o
      JOIN PIZZA_INTELLIGENCE.ANALYTICS.DIM_STORES s ON o.store_id = s.store_id
      WHERE o.order_date >= CURRENT_DATE() - 7
      GROUP BY s.city
      ORDER BY total_revenue DESC

  - name: top_stores_by_revenue
    question: What are the top performing stores by revenue this month?
    sql: |
      SELECT 
        s.store_name,
        s.city,
        s.region,
        COUNT(DISTINCT o.order_id) as total_orders,
        ROUND(SUM(o.total_amount), 2) as total_revenue,
        ROUND(AVG(o.total_amount), 2) as avg_order_value
      FROM PIZZA_INTELLIGENCE.ANALYTICS.FACT_ORDERS o
      JOIN PIZZA_INTELLIGENCE.ANALYTICS.DIM_STORES s ON o.store_id = s.store_id
      WHERE o.order_date >= DATE_TRUNC('month', CURRENT_DATE())
      GROUP BY s.store_name, s.city, s.region
      ORDER BY total_revenue DESC
      LIMIT 10

